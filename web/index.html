<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-visual" />
		<!-- Added to a phone's Home Screen, the page opens full screen like an app. -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent" />
		<meta name="theme-color" content="#000000" />
		<!-- The server fills in the title (index_html in src/server.rs). -->
		<meta name="application-name" content="{{title}}" />
		<meta name="apple-mobile-web-app-title" content="{{title}}" />
		<link rel="icon" href="favicon.ico" />
		<link
			rel="preload"
			href="inter.woff2"
			as="font"
			type="font/woff2"
			crossorigin />
		<title>{{title}}</title>
		<style>
			/* Inter (latin subset of the variable font), as used by the Tembo app. */
			@font-face {
				font-family: 'Inter';
				src: url(inter.woff2) format('woff2');
				font-weight: 100 900;
				font-style: normal;
				font-display: swap;
			}
			/* Dark theme tokens from the Tembo UI package (packages/ui/src/styles/globals.css). */
			:root {
				--surface-raised: #212121;
				--surface-secondary: #383838;
				--text-title: #ffffffeb;
				--text-strong: #ffffffcc;
				--text-default: #ffffffb8;
				--text-weak: #ffffff80;
				--text-muted: #ffffff3d;
				--icon-title: #e0e0e0;
				--icon-strong: #b8b8b8;
				--icon-default: #9e9e9e;
				--state-hover: #ffffff14;
				--state-pressed: #ffffff29;
				--fill-tertiary: #ffffff14;
				--fill-tertiary-hover: #ffffff1f;
				--fill-tertiary-pressed: #ffffff33;
				--fill-primary: #5c5c5c;
				--fill-primary-hover: #858585;
				--fill-primary-pressed: #9e9e9e;
				--border-default: #ffffff0f;
				--accent: #118af3;
				--accent-subtle: #0083f514;
				--positive: #25b134;
				--negative: #f15555;
				--focus-ring:
					0 0 0 1px #009eff,
					0 0 0 2px color-mix(in srgb, #009eff 24%, transparent);
				--shadow-white-border:
					0 0 4px 0 rgba(0, 0, 0, 0.04), 0 0 2px 0 rgba(0, 0, 0, 0.06),
					0 0 1px 0 rgba(0, 0, 0, 0.1);
				--shadow-lg:
					0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
				--font:
					'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
					sans-serif;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: #000;
				overflow: hidden;
				overscroll-behavior: none;
			}
			body {
				-webkit-font-smoothing: antialiased;
				-webkit-user-select: none;
				user-select: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent;
			}
			/* Sized and placed by viewport.ts: fitted, zoomed and panned. */
			#surface {
				position: fixed;
				left: 0;
				top: 0;
				outline: none;
				touch-action: none;
			}
			/* Follows the visual viewport (the part above a phone's keyboard), so the
			   toolbar and the extra keys stay in sight while typing. */
			#vv {
				position: fixed;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
				pointer-events: none;
				z-index: 3;
			}
			#screen {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
				pointer-events: none;
			}
			.stripe {
				position: absolute;
				left: 0;
				width: 100%;
				display: block;
				pointer-events: none;
				object-fit: fill;
			}
			/* On-screen so mobile browsers will open the soft keyboard for it. */
			#kbd {
				position: fixed;
				left: 0;
				top: 0;
				width: 1px;
				height: 1px;
				opacity: 0.01;
				border: 0;
				padding: 0;
				resize: none;
				pointer-events: none;
				font-size: 16px;
			}
			svg.i {
				width: 16px;
				height: 16px;
				padding: 2px;
				box-sizing: content-box;
				flex: none;
				color: var(--icon-default);
			}
			button {
				font: inherit;
				color: inherit;
			}
			button:focus-visible {
				outline: none;
				box-shadow: var(--focus-ring);
			}

			/* Toolbar: ghost icon buttons in a frosted bar, like the app's tooltip surface. */
			#tools {
				position: absolute;
				top: calc(8px + env(safe-area-inset-top));
				right: calc(8px + env(safe-area-inset-right));
				display: flex;
				gap: 2px;
				padding: 2px;
				z-index: 3;
				opacity: 0;
				transition: opacity 0.1s;
				pointer-events: none;
				background: color-mix(in srgb, var(--surface-raised) 90%, transparent);
				border: 1.5px solid var(--border-default);
				border-radius: 12px;
				box-shadow:
					0 20px 25px -5px rgba(0, 0, 0, 0.1),
					0 8px 10px -6px rgba(0, 0, 0, 0.1);
				backdrop-filter: blur(30px);
				-webkit-backdrop-filter: blur(30px);
			}
			#tools.show {
				opacity: 1;
				pointer-events: auto;
			}
			#tools.touch {
				top: auto;
				bottom: calc(12px + env(safe-area-inset-bottom));
			}
			.xkeys #tools.touch {
				bottom: calc(var(--xk-h, 0px) + 8px);
			}
			/* Out of the way while typing above a phone's keyboard. */
			.kb-open #tools.touch {
				opacity: 0.55;
			}
			.ib {
				width: 28px;
				height: 28px;
				border: 0;
				padding: 0;
				border-radius: 8px;
				background: transparent;
				display: inline-grid;
				place-items: center;
				cursor: pointer;
				transition:
					transform 0.15s ease-out,
					background-color 0.15s ease-out;
			}
			.ib:hover {
				background: var(--state-hover);
			}
			.ib:active {
				background: var(--state-pressed);
				transform: scale(0.97);
			}
			.ib:hover svg.i,
			.ib.on svg.i {
				color: var(--icon-title);
			}
			.ib.sm {
				width: 24px;
				height: 24px;
			}
			#tools.touch .ib {
				width: 40px;
				height: 40px;
			}
			#tools.touch .ib svg.i {
				width: 20px;
				height: 20px;
			}
			.ib:disabled {
				opacity: 0.35;
				pointer-events: none;
			}
			#kb-btn,
			#dev-btn,
			#keys-btn,
			#zoom-reset,
			#files-btn,
			#mic-btn {
				display: none !important;
			}
			/* Fingers pinch to zoom; the buttons are for mice. */
			#tools.touch #zoom-in,
			#tools.touch #zoom-out {
				display: none !important;
			}
			.zoomed #zoom-reset {
				display: inline-grid !important;
			}
			#tools.sim #dev-btn,
			#tools.touch #kb-btn,
			#tools.touch #keys-btn,
			#tools.files #files-btn,
			#tools.mic #mic-btn {
				display: inline-grid !important;
			}
			/* Read-only: nothing on the desktop accepts what the keyboard would send. */
			#tools.read-only #kb-btn,
			#tools.read-only #keys-btn {
				display: none !important;
			}
			/* While the microphone is live the toolbar stays up as a recording indicator. */
			#tools.mic-on {
				opacity: 1;
				pointer-events: auto;
			}
			#mic-btn .on,
			#mic-btn.on .off {
				display: none;
			}
			#mic-btn.on .on {
				display: block;
			}
			#mic-btn.on,
			#mic-btn.on:hover {
				background: color-mix(in srgb, var(--negative) 18%, transparent);
			}
			#mic-btn.on svg.i,
			#mic-btn.on:hover svg.i {
				color: var(--negative);
			}
			#mic-btn.err svg.i {
				color: var(--negative);
			}

			#status {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 0 24px;
				text-align: center;
				color: var(--text-weak);
				font: 520 14px/20px var(--font);
				letter-spacing: -0.1px;
				pointer-events: none;
			}
			#stats {
				position: fixed;
				top: 6px;
				left: 6px;
				padding: 6px 8px;
				background: rgba(0, 0, 0, 0.7);
				color: #b8f7c4;
				font:
					12px/1.35 ui-monospace,
					Menlo,
					monospace;
				white-space: pre;
				border-radius: 4px;
				pointer-events: none;
				display: none;
				z-index: 2;
			}

			/* Files panel: the app's dialog frame (secondary surface, 16px radius, 4px inset) around a raised body. */
			#files {
				position: fixed;
				top: 8px;
				right: 8px;
				bottom: 8px;
				width: min(360px, calc(100vw - 16px));
				z-index: 4;
				display: none;
				flex-direction: column;
				box-sizing: border-box;
				padding: 4px;
				background: var(--surface-secondary);
				border: 1px solid var(--border-default);
				border-radius: 16px;
				box-shadow: var(--shadow-lg);
				color: var(--text-default);
				font: 440 13px/16px var(--font);
				letter-spacing: -0.2px;
			}
			#files.open {
				display: flex;
				animation: enter 0.15s cubic-bezier(0.23, 1, 0.32, 1);
			}
			@keyframes enter {
				from {
					opacity: 0;
					transform: translateY(-4px) scale(0.98);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#files.open {
					animation: none;
				}
			}
			#files header {
				display: flex;
				align-items: center;
				gap: 4px;
				height: 32px;
				margin-top: -2px;
				padding: 6px 2px 6px 8px;
				box-sizing: border-box;
			}
			#files header h2 {
				flex: 1;
				margin: 0;
				font-size: 13px;
				line-height: 1;
				font-weight: 520;
				color: var(--text-default);
			}
			.btn {
				height: 24px;
				border: 0;
				border-radius: 8px;
				padding: 4px;
				display: inline-flex;
				align-items: center;
				gap: 2px;
				cursor: pointer;
				font-weight: 520;
				font-size: 13px;
				line-height: 16px;
				letter-spacing: -0.2px;
				white-space: nowrap;
				transition: background-color 0.1s;
			}
			.btn span {
				padding: 0 3px 0 1px;
			}
			.btn.primary {
				color: var(--text-title);
				background: var(--fill-primary);
				box-shadow:
					0 0 0 1px rgba(255, 255, 255, 0.08) inset,
					0 -1px 2px 0 rgba(255, 255, 255, 0.12) inset,
					0 1px 2px 0 rgba(255, 255, 255, 0.16) inset;
			}
			.btn.primary svg.i {
				color: #fff;
			}
			.btn.primary:hover {
				background: var(--fill-primary-hover);
			}
			.btn.primary:active {
				background: var(--fill-primary-pressed);
			}
			.body {
				flex: 1;
				min-height: 0;
				display: flex;
				flex-direction: column;
				background: var(--surface-raised);
				border-radius: 12px;
				box-shadow: var(--shadow-white-border);
				overflow: hidden;
			}
			#files-crumbs {
				display: flex;
				align-items: center;
				flex-wrap: nowrap;
				gap: 0;
				padding: 6px 8px 2px;
				min-height: 28px;
				overflow: hidden;
			}
			#files-crumbs a {
				height: 28px;
				display: inline-flex;
				align-items: center;
				padding: 0 8px;
				border-radius: 8px;
				color: var(--text-weak);
				font-weight: 520;
				cursor: pointer;
				text-decoration: none;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				min-width: 0;
				flex-shrink: 1;
			}
			#files-crumbs a:hover {
				background: var(--state-hover);
			}
			#files-crumbs a:last-child {
				color: var(--text-default);
				flex-shrink: 0;
				max-width: 60%;
			}
			#files-crumbs svg.i {
				color: var(--text-muted);
				padding: 0;
				margin: 0 -2px;
			}
			#files-list {
				flex: 1;
				overflow-y: auto;
				padding: 2px 6px 6px;
				scrollbar-width: thin;
				scrollbar-color: #ffffff29 transparent;
			}
			.f-row {
				display: flex;
				align-items: center;
				gap: 6px;
				height: 32px;
				padding: 0 8px 0 4px;
				border-radius: 6px;
				cursor: pointer;
			}
			.f-row:hover {
				background: var(--state-hover);
			}
			.f-row:active {
				background: var(--state-pressed);
			}
			.f-row .f-name {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--text-default);
				font-weight: 520;
			}
			.f-row:hover .f-name {
				color: var(--text-title);
			}
			.f-row .f-meta {
				color: var(--text-muted);
				font-weight: 440;
				white-space: nowrap;
				font-variant-numeric: tabular-nums;
			}
			.f-row:hover svg.i {
				color: var(--icon-strong);
			}
			/* Download a folder as a zip: shown in place of the date on hover. */
			.f-row .f-dl {
				display: none;
				margin: 0 -4px 0 0;
			}
			.f-row:hover .f-dl,
			.f-row .f-dl:focus-visible {
				display: inline-flex;
			}
			.f-row:hover .f-dl + .f-meta {
				display: none;
			}
			.f-empty {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 48px 16px;
			}
			.f-empty svg.i {
				width: 20px;
				height: 20px;
				color: var(--icon-default);
				margin-bottom: 10px;
			}
			.f-empty b {
				color: var(--text-strong);
				font-weight: 600;
			}
			.f-empty span {
				color: var(--text-weak);
				font-weight: 520;
				margin-top: 6px;
				max-width: 240px;
			}
			#files-uploads:empty {
				display: none;
			}
			#files-uploads {
				border-top: 1px solid var(--border-default);
				padding: 6px 6px;
				max-height: 40%;
				overflow-y: auto;
			}
			.f-up {
				padding: 6px 8px;
				border-radius: 6px;
			}
			.f-up-top {
				display: flex;
				gap: 8px;
				align-items: center;
			}
			.f-up .f-name {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--text-default);
				font-weight: 520;
			}
			.f-up .f-meta {
				color: var(--text-weak);
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
			}
			.f-up.err .f-meta {
				color: var(--negative);
			}
			.f-up.done .f-meta {
				color: var(--positive);
			}
			.f-bar {
				height: 4px;
				margin-top: 6px;
				background: var(--accent-subtle);
				border-radius: 999px;
				overflow: hidden;
			}
			.f-bar i {
				display: block;
				height: 100%;
				width: 0;
				background: var(--accent);
				border-radius: 999px;
				transition: width 0.15s;
			}
			.f-up.done .f-bar,
			.f-up.err .f-bar {
				display: none;
			}
			#files footer {
				padding: 8px 8px 4px;
				color: var(--text-weak);
			}

			/* Drop target: a dialog-style card over a scrim. */
			#drop {
				position: fixed;
				inset: 0;
				z-index: 5;
				display: none;
				align-items: center;
				justify-content: center;
				background: #00000033;
				pointer-events: none;
			}
			#drop.show {
				display: flex;
			}
			#drop .frame {
				padding: 4px;
				background: var(--surface-secondary);
				border: 1px solid var(--border-default);
				border-radius: 16px;
				box-shadow: var(--shadow-lg);
			}
			#drop .inner {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 6px;
				padding: 24px 32px;
				background: var(--surface-raised);
				border-radius: 12px;
				box-shadow: var(--shadow-white-border);
				outline: 1.5px dashed #ffffff33;
				outline-offset: -8px;
				font: 520 13px/16px var(--font);
				letter-spacing: -0.2px;
				color: var(--text-weak);
			}
			#drop .inner svg.i {
				width: 20px;
				height: 20px;
				color: var(--icon-title);
				margin-bottom: 4px;
			}
			#drop .inner b {
				color: var(--text-strong);
				font-weight: 600;
				font-size: 14px;
				line-height: 20px;
				letter-spacing: -0.1px;
			}

			/* Extra keys: two rows above the on-screen keyboard (extrakeys.ts). */
			#xkeys {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 0;
				display: none;
				flex-direction: column;
				gap: 4px;
				padding: 5px calc(4px + env(safe-area-inset-right)) 5px
					calc(4px + env(safe-area-inset-left));
				pointer-events: auto;
				background: color-mix(in srgb, var(--surface-raised) 94%, transparent);
				border-top: 1px solid var(--border-default);
				backdrop-filter: blur(30px);
				-webkit-backdrop-filter: blur(30px);
				font: 560 14px/1 var(--font);
				touch-action: none;
			}
			/* Keyboard down: clear the home indicator. */
			html:not(.kb-open) #xkeys {
				padding-bottom: calc(5px + env(safe-area-inset-bottom));
			}
			#xkeys.show {
				display: flex;
			}
			.xrow {
				display: flex;
				gap: 4px;
			}
			.xk {
				flex: 1 1 0;
				min-width: 0;
				height: 38px;
				padding: 0;
				border: 0;
				border-radius: 8px;
				background: var(--fill-tertiary);
				color: var(--text-strong);
				font: inherit;
				letter-spacing: -0.2px;
				white-space: nowrap;
				overflow: hidden;
				cursor: pointer;
				-webkit-user-select: none;
				user-select: none;
				touch-action: none;
				transition: background-color 0.08s;
			}
			.xk.down,
			.xk:active {
				background: var(--fill-tertiary-pressed);
			}
			.xk.act {
				color: var(--text-weak);
			}
			.xk svg.i {
				width: 20px;
				height: 20px;
				vertical-align: middle;
				color: var(--icon-strong);
			}
			.xk.mod {
				color: var(--text-default);
			}
			.xk.on {
				background: color-mix(in srgb, var(--accent) 35%, transparent);
				color: #fff;
			}
			.xk.lock {
				background: var(--accent);
				color: #fff;
				box-shadow: 0 0 0 1px #ffffff40 inset;
			}
			/* iOS Simulator device buttons (device.ts), above the toolbar on touch
			   devices and below it with a mouse. */
			#devpanel {
				position: absolute;
				right: calc(8px + env(safe-area-inset-right));
				top: calc(52px + env(safe-area-inset-top));
				display: none;
				grid-template-columns: repeat(5, auto);
				gap: 4px;
				padding: 6px;
				pointer-events: auto;
				background: color-mix(in srgb, var(--surface-raised) 94%, transparent);
				border: 1.5px solid var(--border-default);
				border-radius: 12px;
				box-shadow: var(--shadow-lg);
				backdrop-filter: blur(30px);
				-webkit-backdrop-filter: blur(30px);
				font: 560 13px/1 var(--font);
				z-index: 4;
			}
			#devpanel.open {
				display: grid;
			}
			:has(#tools.touch) #devpanel {
				top: auto;
				bottom: calc(68px + env(safe-area-inset-bottom));
			}
			.xkeys:has(#tools.touch) #devpanel {
				bottom: calc(var(--xk-h, 0px) + 64px);
			}
			.dk {
				min-width: 52px;
				height: 36px;
				padding: 0 10px;
				border: 0;
				border-radius: 8px;
				background: var(--fill-tertiary);
				color: var(--text-strong);
				font: inherit;
				cursor: pointer;
				white-space: nowrap;
			}
			.dk:active {
				background: var(--fill-tertiary-pressed);
			}
			.dk.wide {
				grid-column: 1 / -1;
				color: var(--text-weak);
			}
			.dk.wide.on {
				color: #fff;
				background: color-mix(in srgb, var(--accent) 35%, transparent);
			}
			#hint {
				position: absolute;
				left: 50%;
				top: calc(16px + env(safe-area-inset-top));
				transform: translateX(-50%);
				max-width: min(340px, calc(100% - 32px));
				padding: 10px 14px;
				border-radius: 12px;
				background: var(--surface-raised);
				border: 1px solid var(--border-default);
				box-shadow: var(--shadow-lg);
				color: var(--text-strong);
				font: 520 13px/18px var(--font);
				text-align: center;
				opacity: 0;
				transition: opacity 0.15s;
				pointer-events: none;
			}
			#hint.show {
				opacity: 1;
			}
			#fill-btn {
				position: relative;
			}
			#fill-btn[data-mode='auto']::after {
				content: 'A';
				position: absolute;
				right: 2px;
				bottom: 1px;
				font:
					700 9px/1 system-ui,
					sans-serif;
			}
		</style>
	</head>
	<body>
